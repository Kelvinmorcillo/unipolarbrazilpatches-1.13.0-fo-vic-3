##new smd

 concept_weapon_of_mass_destruction:0 "Weapon of Mass Destruction"
 concept_weapon_of_mass_destruction_desc:0 "A $concept_weapon_of_mass_destruction$ is a powerful instrument used by $concept_armies$ to kill vast swamths of people in quick periods of time"
 concept_nuclear_weapon:0 "Nuclear Weapons"
 concept_nuclear_weapon_desc:0 "$concept_nuclear_weapon$ are explosive devices and $concept_weapon_of_mass_destruction$ that derives their destructive force from nuclear reactions, either nuclear fission (fission or atomic bomb) or a combination of fission and nuclear fusion reactions"
 concept_missile:0 "Missiles"
 concept_missile_desc:0 "$concept_missile$ refer to any weapon accessed through the strategic warfare panel, including $concept_weapon_of_mass_destruction$."
##public service expenses
 concept_smd_healthcare:0 "Healthcare"
 concept_smd_healthcare_desc:0 "$concept_smd_healthcare$ is the state-funded provision of medical services to the population, run through the health system [concept_institution]. Maintaining it costs the government money each month, scaling with investment and population."
 concept_smd_education:0 "Education"
 concept_smd_education_desc:0 "$concept_smd_education$ is the state-funded schooling of the population, run through the schools [concept_institution]. Maintaining it costs the government money each month, scaling with investment, population, and schooling and childcare laws."
 concept_smd_police:0 "Police"
 concept_smd_police_desc:0 "$concept_smd_police$ is the state-funded enforcement of law and order, run through the police [concept_institution]. Maintaining it costs the government money each month, scaling with investment and population."
