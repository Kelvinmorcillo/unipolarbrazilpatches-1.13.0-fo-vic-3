l_english:
 containerization:0 "Containerization"
 containerization_desc:0 "The standard steel box ends break-bulk handling, and a ship that once spent a week in port now turns around in hours."
 integrated_circuits:0 "Integrated Circuits"
 integrated_circuits_desc:0 "Dozens of transistors etched onto a single wafer, then hundreds, then thousands."
 numerical_control:0 "Numerical Control Machining"
 numerical_control_desc:0 "Machine tools that follow punched tape instead of a machinist, cutting the same part a thousand times without drift."
 catalytic_cracking:0 "Catalytic Cracking"
 catalytic_cracking_desc:0 "Heavy fractions broken down under catalysis, wringing far more light product out of every barrel."
 jet_airliners:0 "Jet Airliners"
 jet_airliners_desc:0 "Turbofans put intercontinental travel within reach of the middle class and freight on a schedule."
 green_revolution:0 "Green Revolution"
 green_revolution_desc:0 "Dwarf cultivars, nitrogen fertiliser and irrigation together multiply cereal yields across the developing world."
 civil_nuclear_power:0 "Civil Nuclear Power"
 civil_nuclear_power_desc:0 "Fission plants feeding the grid at baseload, indifferent to the price of coal."
 offshore_drilling:0 "Offshore Drilling"
 offshore_drilling_desc:0 "Fixed platforms working water depths that were unreachable a decade ago."
 continuous_casting:0 "Continuous Casting"
 continuous_casting_desc:0 "Steel poured straight to strand rather than ingot, cutting a whole reheating stage out of the mill."
 mainframe_computing:0 "Mainframe Computing"
 mainframe_computing_desc:0 "Batch processing on leased iron, and with it payroll, inventory and reservations at national scale."
 colour_television:0 "Colour Television"
 colour_television_desc:0 "A screen in most living rooms, and an advertising market built around it."
 mass_higher_education:0 "Mass Higher Education"
 mass_higher_education_desc:0 "Universities open to a share of the population their founders never imagined."
 social_insurance:0 "Social Insurance"
 social_insurance_desc:0 "Contributory pensions and unemployment cover, indexed and universal."
 civil_rights_legislation:0 "Civil Rights Legislation"
 civil_rights_legislation_desc:0 "Formal equality written into statute, and the machinery to enforce it."
 environmental_regulation:0 "Environmental Regulation"
 environmental_regulation_desc:0 "Emissions limits, impact assessments and an agency with the power to close a plant."
 floating_exchange_rates:0 "Floating Exchange Rates"
 floating_exchange_rates_desc:0 "Bretton Woods abandoned; currencies find their own level and finance follows."
 urban_renewal:0 "Urban Renewal"
 urban_renewal_desc:0 "Slum clearance, ring roads and towers, with all the consequences that followed."
 public_health_screening:0 "Public Health Screening"
 public_health_screening_desc:0 "Population-wide screening catches disease before it presents."
 air_traffic_control:0 "Air Traffic Control"
 air_traffic_control_desc:0 "Radar separation and controlled airspace make crowded skies survivable."
 consumer_protection:0 "Consumer Protection"
 consumer_protection_desc:0 "Product liability, labelling standards and recall powers."
