l_english:
 brz_impeachment.1.t:0 "The Impeachment of Fernando Collor"
 brz_impeachment.1.d:0 "On 29 September 1992, Brazil's Chamber of Deputies voted to authorize impeachment proceedings against President Fernando Collor de Mello amid corruption allegations and mass protests. The case now moves to the Senate."
 brz_impeachment.1.a:0 "The Senate will decide his fate."
 brz_impeachment.2.t:0 "Itamar Franco Assumes the Presidency"
 brz_impeachment.2.d:0 "With Collor suspended on 2 October 1992, Vice President Itamar Franco assumes the presidency while the Senate conducts the impeachment trial."
 brz_impeachment.2.a:0 "The government must continue."
 brz_impeachment.3.t:0 "Collor Is Impeached"
 brz_impeachment.3.d:0 "On 29 December 1992, Collor resigned as the Senate was preparing to convict him. The Senate proceeded with the trial, convicted him of impeachable offenses, and barred him from holding public office for eight years. Itamar Franco's presidency is now confirmed."
 brz_impeachment.3.a:0 "A new chapter begins."
 brz_impeachment.4.t:0 "Impeachment Proceedings Against Dilma Rousseff"
 brz_impeachment.4.d:0 "On 2 December 2015, the President of the Chamber of Deputies accepted a petition to impeach President Dilma Rousseff. The proceedings will test the strength of her coalition amid deepening political and economic turmoil."
 brz_impeachment.4.a:0 "The process moves forward."
 brz_impeachment.5.t:0 "A New Voice for the Armed Forces"
 brz_impeachment.5.d:0 "On 12 May 2016, the Senate voted to open an impeachment trial, suspending Dilma Rousseff from office. Michel Temer assumed the presidency while the trial proceeded. Amid the crisis, former army captain and congressman Jair Bolsonaro rises to lead the Armed Forces Interest Group, giving him a path to higher office through Brazil's ordinary political process."
 brz_impeachment.5.a:0 "A new political force emerges."
 brz_impeachment.6.t:0 "Dilma Rousseff Is Removed from Office"
 brz_impeachment.6.d:0 "On 31 August 2016, the Senate convicted Dilma Rousseff and removed her from office over budgetary actions. Michel Temer assumed the presidency for the remainder of the term."
 brz_impeachment.6.a:0 "A contentious chapter closes."
